name: SFA PMI probe

# Manual-only experiment (ADR-0039, open PMI decision): run the NIST STEP File Analyzer (SFA)
# on a clean Windows runner and collect what it reports. Nothing here builds, publishes or
# changes kSTEP; the result is evidence for the PMI decision, nothing more.
#
# Trust notes:
#  * The SFA archive and the NIST PMI test files come from the official usnistgov/SFA repository,
#    pinned to one commit. The SHA-256 of each download is printed in the log so it can be pinned
#    here after the first run (trust on first use).
#  * The analyzer is an unsigned third-party Windows program; it runs only on this throw-away runner,
#    with a read-only token and no secrets.
#  * The SFA command line, and whether Excel exists on the runner, are not verified: every analyzer
#    step is allowed to fail, and the job always uploads whatever it produced plus the diagnostics.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SFA_COMMIT: 1236017676c0fa1f24f0fb4642fb088437a406f7
  SFA_BASE: https://raw.githubusercontent.com/usnistgov/SFA/1236017676c0fa1f24f0fb4642fb088437a406f7/Release

jobs:
  probe:
    name: SFA on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download SFA and the NIST PMI test files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sfa-work | Out-Null
          foreach ($f in 'SFA-5.54.zip', 'NIST-PMI-STEP-Files.zip') {
            Invoke-WebRequest -Uri "$env:SFA_BASE/$f" -OutFile "sfa-work/$f"
            "{0}  {1} bytes  sha256 {2}" -f $f, (Get-Item "sfa-work/$f").Length, (Get-FileHash "sfa-work/$f" -Algorithm SHA256).Hash
          }
          Expand-Archive sfa-work/SFA-5.54.zip -DestinationPath sfa-work/sfa
          Expand-Archive sfa-work/NIST-PMI-STEP-Files.zip -DestinationPath sfa-work/nist
          "--- SFA files"; Get-ChildItem sfa-work/sfa -Recurse -File | Select-Object -First 40 FullName, Length
          "--- NIST files"; Get-ChildItem sfa-work/nist -Recurse -File | Select-Object -First 40 FullName, Length

      - name: Environment diagnostics (Excel present?)
        shell: pwsh
        continue-on-error: true
        run: |
          "OS: " + [System.Environment]::OSVersion.VersionString
          $excel = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\excel.exe' -ErrorAction SilentlyContinue
          if ($excel) { "Excel: " + $excel.'(default)' } else { "Excel: not found" }

      - name: Prime SFA and install the IFCsvr toolkit
        shell: pwsh
        run: |
          # The toolkit installer (.msi in %TEMP%\SFA) is only unpacked when SFA processes a real file.
          $cl = Get-ChildItem sfa-work/sfa -Recurse -Filter 'sfa-cl.exe' | Select-Object -First 1
          $first = Get-ChildItem sfa-work/nist -Recurse -Include *.stp, *.step | Select-Object -First 1
          $p = Start-Process -FilePath $cl.FullName -ArgumentList ('"' + $first.FullName + '" nolog noopen') -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { $p.Kill(); "prime timeout" } else { "prime exit code: " + $p.ExitCode }
          $msi = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Temp\SFA') -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { Get-ChildItem $env:LOCALAPPDATA\Temp -Recurse -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 5 FullName; throw 'no toolkit .msi found' }
          "installing " + $msi.FullName + " sha256 " + (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
          $i = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          "msiexec exit code: " + $i.ExitCode
          if ($i.ExitCode -ne 0 -and $i.ExitCode -ne 3010) { throw "toolkit install failed" }

      - name: Run SFA on the NIST PMI and kSTEP golden files
        shell: pwsh
        run: |
          $cl = Get-ChildItem sfa-work/sfa -Recurse -Filter 'sfa-cl.exe' | Select-Object -First 1
          New-Item -ItemType Directory -Force sfa-out/nist, sfa-out/kstep | Out-Null
          $inputs = @()
          Get-ChildItem sfa-work/nist -Recurse -Include *.stp, *.step | Select-Object -First 3 | ForEach-Object { Copy-Item $_.FullName sfa-out/nist/; $inputs += "sfa-out/nist/$($_.Name)" }
          foreach ($n in 'export-golden-box', 'export-golden-part-colour', 'export-golden-subassembly-colour') {
            Copy-Item "kstep-tests/src/test/resources/$n.step" sfa-out/kstep/; $inputs += "sfa-out/kstep/$n.step"
          }
          $refused = $false
          foreach ($f in $inputs) {
            "=== analysing $f"
            $log = "sfa-out/" + ($f -replace '[/\\]', '_') + ".console.txt"
            $p = Start-Process -FilePath $cl.FullName -ArgumentList ('"' + (Join-Path $PWD $f) + '" csv noopen') -PassThru -NoNewWindow -RedirectStandardOutput $log
            if (-not $p.WaitForExit(300000)) { $p.Kill(); "timeout: $f" } else { "exit code: " + $p.ExitCode }
            $text = Get-Content $log -Raw
            $text
            if ($text -match 'toolkit must be installed') { $refused = $true }
          }
          "--- produced files"; Get-ChildItem sfa-out -Recurse -File | ForEach-Object { "{0} ({1} bytes)" -f $_.FullName, $_.Length }
          if ($refused) { throw 'SFA still refuses to analyse: IFCsvr toolkit not usable' }

      - name: Collect results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfa-pmi-probe
          path: sfa-out/
          if-no-files-found: warn
          retention-days: 14
