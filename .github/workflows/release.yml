name: Release

# Builds the kstep-cli distribution for a pushed vX.Y.Z tag, verifies it, and creates or
# updates the GitHub release with the zip and its SHA-256 checksum. See ADR-0025. Since ADR-0100
# the release also carries two native runtime archives (linux-x86-64, macos-aarch64) built and
# verified on their own platform, and a repository_dispatch updates the Homebrew tap.
#
# Design notes
# - GitHub release handling uses the `gh` CLI only. softprops/action-gh-release is avoided
#   (known HTTP 401 failure while finalizing the release).
# - Two jobs with separated rights: `build` runs repository code and has contents: read;
#   `publish` has contents: write but checks out and runs no repository code.
# - The native bridges (OCCT, PlaneGCS) are switched off with -P...includeDir=/nonexistent:
#   kstep-geometry/kstep-constraints put the built .so into their own jars via
#   processResources, so a runner image with Eigen/Boost headers would otherwise leak a
#   Linux-only library into a zip that is advertised as platform independent.
# - Maven Central is published by the job `maven-central`, after the GitHub release, gated on
#   secrets and idempotent (ADR-0043). Not part of this workflow: provenance.
# - Native archives (job `native`, ADR-0100): built with the real OCCT/PlaneGCS bridges, verified by
#   verify-native-dist.sh (strict: exit 3 without OCCT) and check-native-linkage.sh. Both legs are
#   mandatory; if one fails there is no release. `check` is not repeated there: job `build` ran it
#   and ci.yml covers the native test suites on both platforms.
# - The tap job `homebrew-tap` only dispatches; it is skipped (notice) without HOMEBREW_TAP_TOKEN and
#   can never fail the release, which is idempotent and can be re-run.
# - Deliberately NOT pull_request_target. Secrets: the job's github.token, the Maven Central set (one
#   job) and HOMEBREW_TAP_TOKEN (one step).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.2.0'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only; publish nothing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# A running publish is never cancelled: a half-uploaded release is worse than a queued one.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build + verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      commit: ${{ steps.onmaster.outputs.commit }}
      has_publishing: ${{ steps.pubsupport.outputs.has }}
      has_native: ${{ steps.nativesupport.outputs.has }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # First step, before any checkout or build. Event data only arrives via env.
          # Regex identical to scripts/release/validate-tag.sh (no checkout exists yet).
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$TAG" =~ $RE ]]; then
            echo "::error::Invalid release tag. Expected vMAJOR.MINOR.PATCH, no suffix."
            exit 1
          fi
          PRERELEASE=false
          if [ "${BASH_REMATCH[1]}" = "0" ]; then PRERELEASE=true; fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release tooling (workflow revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: scripts/release
        # No ref: this is the commit the workflow itself runs from. Older tags (e.g. v0.1.0)
        # do not contain scripts/release/ yet, hence the second checkout below.

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is on master
        id: onmaster
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          COMMIT="$(git -C src rev-parse "refs/tags/$TAG^{commit}")"
          if ! git -C src merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::Tag $TAG ($COMMIT) is not reachable from master; refusing to release an orphaned commit."
            exit 1
          fi
          if [ "$(git -C src cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::warning::Tag $TAG is lightweight; annotated tags are the convention."
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Detect publishing support in the tagged source
        id: pubsupport
        run: |
          # Older tags (e.g. v0.3.0 rebuilt by dispatch) predate the Maven Central configuration.
          if grep -q 'vanniktech-publish' src/gradle/libs.versions.toml; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The tagged source has no Maven Central publishing configuration; the Maven steps are skipped."
          fi

      - name: Detect native archive support in the tagged source
        id: nativesupport
        run: |
          # Tags older than ADR-0050 have no nativeRuntimeZip task; they get the JVM zip only.
          if grep -q 'register<Zip>("nativeRuntimeZip")' src/kstep-cli/build.gradle.kts \
            && [ -f src/kstep-cli/src/native-dist/bin/kstep ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The tagged source has no native runtime archive support; only the JVM zip is released."
          fi

      - name: Version check (tag vs build.gradle.kts)
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # Must run before Java and Gradle so a wrong tag fails within seconds.
          bash tools/scripts/release/validate-tag.sh "$TAG"
          bash tools/scripts/release/check-version.sh "$VERSION" src/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Same reasoning as ci.yml: a release build must never write the shared cache.
          cache-read-only: true

      - name: Install Skiko runtime libraries
        timeout-minutes: 40
        run: |
          # A slow or stalled mirror once held this step for 61 minutes (2026-10-22) and a retry
          # loop around the whole install timed out again. Download first (apt resumes partial
          # files, so every retry makes progress), then install offline from the local cache.
          PKGS=(libgl1 libfontconfig1 libfreetype6 libx11-6)
          downloaded=0
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                install -y --no-install-recommends --download-only "${PKGS[@]}"; then
              downloaded=1
              break
            fi
            echo "::warning::apt download attempt $attempt failed or timed out"
            sleep 15
          done
          if [ "$downloaded" != 1 ]; then
            echo "::error::apt-get could not download the packages after 3 attempts"
            exit 1
          fi
          sudo timeout 300 apt-get install -y --no-install-recommends "${PKGS[@]}"
        # Needed by kstep-viewer's tests under check. Explicitly NO Eigen, Boost or OCCT:
        # the release zip must not contain native bridges.

      - name: Build and test (native bridges disabled)
        working-directory: src
        run: |
          ./gradlew clean check :kstep-cli:distZip \
            -Pkstep.occt.includeDir=/nonexistent \
            -Pkstep.eigen.includeDir=/nonexistent \
            -Pkstep.boost.includeDir=/nonexistent \
            --stacktrace

      - name: Stage Maven artifacts (no upload)
        if: steps.pubsupport.outputs.has == 'true'
        working-directory: src
        run: |
          # Same checkout, directly after `clean check`: no second clean needed.
          ./gradlew publishAllPublicationsToBuildStagingRepository \
            -Pkstep.native.exclude=true \
            -Pkstep.occt.includeDir=/nonexistent \
            -Pkstep.eigen.includeDir=/nonexistent \
            -Pkstep.boost.includeDir=/nonexistent \
            --no-configuration-cache --stacktrace

      - name: Verify Maven artifacts
        if: steps.pubsupport.outputs.has == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # Every release run, dry runs included, checks the artifacts before anything is published.
          bash tools/scripts/release/verify-maven-artifacts.sh src/build/maven-staging "$VERSION"

      - name: Verify distribution
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # The file name comes from project.version, a second, independent proof of the version check.
          cd src
          bash ../tools/scripts/release/verify-dist.sh \
            "kstep-cli/build/distributions/kstep-cli-$VERSION.zip" "$VERSION" \
            kstep-tests/src/test/resources/hello-assembly.kstep.kts

      - name: Assemble release assets
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          mkdir release-assets
          cp "src/kstep-cli/build/distributions/kstep-cli-$VERSION.zip" release-assets/
          bash tools/scripts/release/checksum.sh "release-assets/kstep-cli-$VERSION.zip"
          bash tools/scripts/release/extract-release-notes.sh "$VERSION" src/CHANGELOG.adoc release-assets/RELEASE_NOTES.md
          ls -l release-assets
          cat "release-assets/kstep-cli-$VERSION.zip.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-reports
          path: |
            src/**/build/reports/
            src/**/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  native:
    name: build + verify native archive (${{ matrix.platform }})
    needs: build
    if: needs.build.outputs.has_native == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-26.04 is a preview label (as in ci.yml). Fallback if it disappears: runs-on
          # ubuntu-latest with `container: ubuntu:26.04` and apt run without sudo.
          - platform: linux-x86-64
            runner: ubuntu-26.04
          - platform: macos-aarch64
            runner: macos-latest
    steps:
      - name: Re-validate tag and version
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$TAG" =~ $RE ]] || [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::Invalid tag/version from build job."
            exit 1
          fi

      - name: Check out release tooling (workflow revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: scripts/release

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Tag still points at the built commit
        env:
          TAG: ${{ needs.build.outputs.tag }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          COMMIT="$(git -C src rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$COMMIT" != "$BUILT_COMMIT" ]; then
            echo "::error::Tag $TAG moved since the build job ($BUILT_COMMIT -> $COMMIT); refusing to build."
            exit 1
          fi

      - name: Compute the apt cache key (one cache entry per ISO week)
        id: aptweek
        if: matrix.platform == 'linux-x86-64'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the downloaded apt packages (the OCCT dev set is ~450 MB)
        if: matrix.platform == 'linux-x86-64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-occt-release-ubuntu-26.04-${{ steps.aptweek.outputs.week }}
          restore-keys: |
            apt-occt-release-ubuntu-26.04-
            apt-occt-ubuntu-26.04-
        # Restore only: a release run never writes a shared cache (see the setup-gradle comment).

      - name: Install OCCT and PlaneGCS build dependencies (Linux)
        if: matrix.platform == 'linux-x86-64'
        timeout-minutes: 40
        run: |
          # Same logic as ci.yml build-native: download first (resumable), then install offline.
          APT_DIR="$HOME/apt-archives"
          mkdir -p "$APT_DIR/partial"
          APT_OPTS=(-o Dir::Cache::Archives="$APT_DIR" -o APT::Sandbox::User=root -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          PKGS=(libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev libocct-data-exchange-dev libocct-ocaf-dev libeigen3-dev libboost-dev libgl1 libfontconfig1 libfreetype6 libx11-6)
          downloaded=0
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get "${APT_OPTS[@]}" update \
              && sudo timeout 600 apt-get "${APT_OPTS[@]}" install -y --no-install-recommends --download-only "${PKGS[@]}"; then
              downloaded=1
              break
            fi
            echo "::warning::apt download attempt $attempt failed or timed out"
            sleep 15
          done
          if [ "$downloaded" != 1 ]; then
            echo "::error::apt-get could not download the packages after 3 attempts"
            exit 1
          fi
          sudo timeout 300 apt-get "${APT_OPTS[@]}" install -y --no-install-recommends "${PKGS[@]}"
          sudo chown -R "$(id -u):$(id -g)" "$APT_DIR"
          for lib in libTKDESTEP libTKXCAF libTKOffset; do
            if [ ! -f "/usr/lib/x86_64-linux-gnu/$lib.so" ]; then
              echo "::error::No $lib.so; kstep-geometry links it (see ci.yml build-native)."
              exit 1
            fi
          done
          grep -m1 'OCC_VERSION_COMPLETE  *"' /usr/include/opencascade/Standard_Version.hxx || true

      - name: Install OCCT and PlaneGCS build dependencies (macOS)
        if: matrix.platform == 'macos-aarch64'
        run: |
          [ "$(uname -m)" = "arm64" ] || { echo "::error::expected an Apple Silicon runner"; exit 1; }
          brew install opencascade eigen boost
          brew list --versions opencascade
          # The bridge links the 7.9 install names (libTK*.7.9.dylib); any other series breaks the archive.
          brew list --versions opencascade | grep -Eq ' 7\.9\.' \
            || { echo "::error::Homebrew OCCT is not 7.9.x; the archive's linkage check would fail."; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build the native archive
        working-directory: src
        env:
          # Lowest macOS the bridge may need; the Linux leg ignores it. Checked via `minos` below.
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          ./gradlew clean :kstep-cli:nativeRuntimeZip \
            -Pkstep.native.embedInJar=false \
            -Pkstep.occt.require=true \
            -Pkstep.planegcs.require=true \
            --no-build-cache --stacktrace

      - name: Verify the archive (strict) and its linkage
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          KSTEP_VERIFY_ALLOW_NO_OCCT: ''
        run: |
          # The strict mode must be on: a missing OCCT is a failure here, never a skip.
          test -z "${KSTEP_VERIFY_ALLOW_NO_OCCT:-}"
          ZIP="kstep-cli/build/distributions/kstep-$VERSION-$PLATFORM-native.zip"
          cd src
          bash ../tools/scripts/release/verify-native-dist.sh "$ZIP" "$VERSION" \
            kstep-tests/src/test/resources/export-box-20x30x40.kstep.kts
          bash ../tools/scripts/release/check-native-linkage.sh "$ZIP" "$VERSION" | tee "$RUNNER_TEMP/linkage.txt"
          {
            echo "### Native archive $PLATFORM"
            echo '```'
            cat "$RUNNER_TEMP/linkage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the archive and its checksum
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir native-assets
          cp "src/kstep-cli/build/distributions/kstep-$VERSION-$PLATFORM-native.zip" native-assets/
          bash tools/scripts/release/checksum.sh "native-assets/kstep-$VERSION-$PLATFORM-native.zip"
          ls -l native-assets

      - name: Upload the native archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: native-assets/
          retention-days: 7
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports-native-${{ matrix.platform }}
          path: |
            src/**/build/reports/
            src/**/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: publish GitHub release
    needs: [build, native]
    # `native` is skipped for tags without native archive support (has_native=false); a failed or
    # cancelled native leg blocks the release. A dry run publishes nothing.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.native.result == 'success' || (needs.native.result == 'skipped' && needs.build.outputs.has_native == 'false')) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access. It checks out and executes no repository code.
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Download native archives
        if: needs.build.outputs.has_native == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: release-assets

      - name: Re-validate tag and verify checksum
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          HAS_NATIVE: ${{ needs.build.outputs.has_native }}
        run: |
          # Defense in depth: job outputs are never trusted unchecked.
          RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$TAG" =~ $RE ]] || [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::Invalid tag/version from build job."
            exit 1
          fi
          cd release-assets
          sha256sum -c "kstep-cli-$VERSION.zip.sha256"
          # Only known file names may be released (a stray artifact must not slip into the release).
          NRE="^(RELEASE_NOTES\\.md|kstep-cli-$VERSION\\.zip(\\.sha256)?|kstep-$VERSION-(linux-x86-64|macos-aarch64)-native\\.zip(\\.sha256)?)$"
          for f in *; do
            [[ "$f" =~ $NRE ]] || { echo "::error::unexpected file in the release assets: $f"; exit 1; }
          done
          if [ "$HAS_NATIVE" = "true" ]; then
            for p in linux-x86-64 macos-aarch64; do
              sha256sum -c "kstep-$VERSION-$p-native.zip.sha256"
            done
            NATIVE_ZIPS=(kstep-*-native.zip)
            [ "${#NATIVE_ZIPS[@]}" = "2" ] || { echo "::error::expected exactly two native archives"; exit 1; }
          fi

      - name: Tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          COMMIT="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          if [ "$COMMIT" != "$BUILT_COMMIT" ]; then
            echo "::error::Tag $TAG moved since the build job ($BUILT_COMMIT -> $COMMIT); refusing to publish."
            exit 1
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          ZIP="release-assets/kstep-cli-$VERSION.zip"
          SUM="$ZIP.sha256"
          NOTES="release-assets/RELEASE_NOTES.md"
          FILES=("$ZIP" "$SUM")
          for f in release-assets/kstep-"$VERSION"-*-native.zip release-assets/kstep-"$VERSION"-*-native.zip.sha256; do
            [ -f "$f" ] && FILES+=("$f")
          done
          ERR="$(mktemp)"
          if gh release view "$TAG" >/dev/null 2>"$ERR"; then
            gh release edit "$TAG" --title "kSTEP $VERSION" --notes-file "$NOTES" \
              --prerelease="$PRERELEASE" --draft=false
            gh release upload "$TAG" "${FILES[@]}" --clobber
          elif grep -qi 'release not found' "$ERR"; then
            FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease --latest=false); fi
            gh release create "$TAG" "${FILES[@]}" --verify-tag \
              --title "kSTEP $VERSION" --notes-file "$NOTES" "${FLAGS[@]}"
          else
            # Auth or network failure must not be mistaken for "release does not exist".
            cat "$ERR" >&2
            exit 1
          fi

      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo '### Release'
            echo '```json'
            gh release view "$TAG" --json url,isPrerelease,assets
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  maven-central:
    name: publish libraries to Maven Central
    needs: [build, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.build.outputs.has_publishing == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Last on purpose: the immutable step comes after the idempotent GitHub release (ADR-0043).
    permissions:
      contents: read
    steps:
      - name: Re-validate tag and version
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$TAG" =~ $RE ]] || [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::Invalid tag/version from build job."
            exit 1
          fi

      - name: Detect Maven Central secrets
        id: gate
        env:
          HAS_USER: ${{ secrets.SONATYPE_USERNAME != '' }}
          HAS_PASS: ${{ secrets.SONATYPE_PASSWORD != '' }}
          HAS_KEY: ${{ secrets.GPG_SIGNING_KEY != '' }}
          HAS_PW: ${{ secrets.GPG_PASSPHRASE != '' }}
        run: |
          # Only booleans and secret NAMES are ever printed, never values.
          missing=()
          [ "$HAS_USER" = "true" ] || missing+=(SONATYPE_USERNAME)
          [ "$HAS_PASS" = "true" ] || missing+=(SONATYPE_PASSWORD)
          [ "$HAS_KEY" = "true" ] || missing+=(GPG_SIGNING_KEY)
          [ "$HAS_PW" = "true" ] || missing+=(GPG_PASSPHRASE)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Maven Central secrets not (fully) configured, skipping upload. Missing: ${missing[*]}"
          fi

      - name: Check out release tooling (workflow revision)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: scripts/release

      - name: Check out tagged source
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Tag still points at the built commit
        if: steps.gate.outputs.ready == 'true'
        env:
          TAG: ${{ needs.build.outputs.tag }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          COMMIT="$(git -C src rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$COMMIT" != "$BUILT_COMMIT" ]; then
            echo "::error::Tag $TAG moved since the build job ($BUILT_COMMIT -> $COMMIT); refusing to publish."
            exit 1
          fi

      - name: Check if libraries are already on Maven Central
        id: mc
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -o pipefail  # a failing probe must fail the step even though its output goes through tee
          bash tools/scripts/release/check-maven-central.sh "$VERSION" | tee probe.txt
          grep '^state=' probe.txt >> "$GITHUB_OUTPUT"
          if grep -qx 'state=published' probe.txt; then
            echo "::notice::v$VERSION is already on Maven Central, skipping the upload."
          fi

      - name: Set up JDK 21
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.gate.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Stage and verify the artifacts that will be uploaded (no secrets)
        if: steps.gate.outputs.ready == 'true' && steps.mc.outputs.state == 'absent'
        working-directory: src
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The upload step below reuses these compiled jars (no `clean`), so what is verified here is what is uploaded.
          ./gradlew clean publishAllPublicationsToBuildStagingRepository \
            -Pkstep.native.exclude=true \
            -Pkstep.occt.includeDir=/nonexistent \
            -Pkstep.eigen.includeDir=/nonexistent \
            -Pkstep.boost.includeDir=/nonexistent \
            --no-configuration-cache --stacktrace
          bash ../tools/scripts/release/verify-maven-artifacts.sh build/maven-staging "$VERSION"

      - name: Publish libraries to Maven Central
        if: steps.gate.outputs.ready == 'true' && steps.mc.outputs.state == 'absent'
        working-directory: src
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # The secrets exist only in this step. No --info/--debug: never log credentials.
          ./gradlew publishToMavenCentral \
            -Pkstep.native.exclude=true \
            -Pkstep.occt.includeDir=/nonexistent \
            -Pkstep.eigen.includeDir=/nonexistent \
            -Pkstep.boost.includeDir=/nonexistent \
            --no-configuration-cache --stacktrace

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          STATE: ${{ steps.mc.outputs.state }}
        run: |
          {
            echo '### Maven Central'
            echo "Version $VERSION, state before upload: $STATE."
            echo 'Deployments: https://central.sonatype.com/publishing/deployments'
            echo 'Artifacts can take up to about 30 minutes to appear on repo1.maven.org.'
          } >> "$GITHUB_STEP_SUMMARY"

  homebrew-tap:
    name: update the Homebrew tap
    needs: [build, publish]
    if: needs.publish.result == 'success' && needs.build.outputs.has_native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dispatch only. Failing here never invalidates the release: it is idempotent and the tap can be
    # updated by hand (see docs/releasing.adoc).
    permissions:
      contents: read
    steps:
      - name: Detect the tap token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not set, skipping the tap update"
          fi

      - name: Re-validate tag and version, tag still on the built commit
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$TAG" =~ $RE ]] || [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::Invalid tag/version from build job."
            exit 1
          fi
          COMMIT="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          if [ "$COMMIT" != "$BUILT_COMMIT" ]; then
            echo "::error::Tag $TAG moved since the build job; refusing to update the tap."
            exit 1
          fi

      - name: Check out release tooling (workflow revision)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: scripts/release

      - name: Download the published native archives and verify them
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # The real release content, not the workflow artifacts: this is what Homebrew will download.
          mkdir assets
          gh release download "$TAG" -p 'kstep-*-native.zip' -p 'kstep-*-native.zip.sha256' -D assets
          cd assets
          for f in *.sha256; do sha256sum -c "$f"; done

      - name: Build the payload
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash tools/scripts/release/tap-payload.sh assets "$VERSION" "$GH_REPO" > payload.json

      - name: Dispatch the tap update
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # The only step that sees the tap token. No set -x; errors are shown without the response body.
          if ! jq -n --slurpfile p payload.json '{event_type: "kstep-release", client_payload: $p[0]}' \
            | gh api repos/kstep-lang/homebrew-kstep/dispatches --method POST --input - >/dev/null 2>dispatch.err; then
            echo "::error::The tap dispatch failed; update the tap by hand (docs/releasing.adoc)."
            head -c 300 dispatch.err | sed -E 's/(token|Bearer) [A-Za-z0-9_-]+/\1 ***/g' >&2
            exit 1
          fi

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        run: |
          # shellcheck disable=SC2016  # the backticks are Markdown, not command substitution
          {
            echo '### Homebrew tap'
            echo 'Dispatched `kstep-release` to kstep-lang/homebrew-kstep with:'
            echo '```json'
            cat payload.json
            echo '```'
            echo 'Manual alternative: `gh workflow run update-formula.yml -R kstep-lang/homebrew-kstep -f version=<v> -f macos_sha256=<sha> -f linux_sha256=<sha>`'
          } >> "$GITHUB_STEP_SUMMARY"
